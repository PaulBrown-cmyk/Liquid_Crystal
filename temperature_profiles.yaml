  order_floor: 0.05
  elastic_alpha_per_K: 0.015
  anchoring_alpha_per_K: 0.02
  sidewall_anchoring_alpha_per_K: 0.03
  cap_anchoring_alpha_per_K: 0.01
  mobility_gamma_per_K: 0.02
