  mode: oscillatory_z
  law: ldg_proxy
  base_temperature_K: 306.7
  reference_temperature_K: 298.15
  transition_temperature_K: 307.0
  gradient_z_K_per_m: 0.0
  gradient_r_K_per_m: 0.0
